name: Publicar V1 Linux validado
on:
  push:
    branches: [zernio-whatsapp]
    paths: [.github/workflows/publicar-zernio.yml]
permissions:
  contents: read
concurrency:
  group: zernio-release-vocero-crm
  cancel-in-progress: false
jobs:
  imagen:
    if: github.repository == 'Dwarvesmx/vocero-crm'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      IMAGE: ghcr.io/dwarvesmx/vocero-crm
      VERSION: 2.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Comprobar fuente exacta
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dwarvesmx/vocero-crm:2.7.0-zernio-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Dwarvesmx/vocero-crm
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=2.7.0
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verificar artefacto publicado
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          REF="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$REF" | tee manifest.txt
          docker pull --platform linux/amd64 "$REF"
          docker image inspect "$REF" > image-inspect.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('image-inspect.json'))[0]
          assert x['Os']=='linux' and x['Architecture']=='amd64'
          labels=x['Config']['Labels']
          assert labels['org.opencontainers.image.revision']==os.environ['SOURCE_SHA']
          assert labels['org.opencontainers.image.version']==os.environ['VERSION']
          env=dict(s.split('=',1) for s in x['Config']['Env'])
          for key in ('ZERNIO_WHATSAPP_ENABLED','ZERNIO_NEA_AUTO_ENABLED','ZERNIO_NEA_DISPATCH_ENABLED','NEA_DURABLE_RESPONSE_IDS'):
              assert env.get(key,'false').lower()!='true'
          PY
          echo "$REF" | tee image-reference.txt
          printf '### Imagen verificada\n\n%s\n\nFuente: %s\n\nPlataforma: linux/amd64\n' "$REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Validar PDF y dependencia nativa en imagen final Linux
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/tests/fixtures/kb-v1,dst=/fixtures,readonly" \
            --mount "type=bind,src=$PWD/scripts/check-kb-linux.mjs,dst=/check-kb-linux.mjs,readonly" \
            --entrypoint node "$IMAGE@$DIGEST" /check-kb-linux.mjs | tee pdf-linux.json
          docker run --rm --platform linux/amd64 --network none --read-only \
            --entrypoint sh "$IMAGE@$DIGEST" -c 'sha256sum /app/drizzle/0031_*.sql /app/drizzle/0032_*.sql /app/drizzle/0033_*.sql' > migrations-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidencia-vocero-crm-${{ github.sha }}
          path: |
            manifest.txt
            image-inspect.json
            image-reference.txt
            pdf-linux.json
            migrations-sha256.txt
          retention-days: 30

